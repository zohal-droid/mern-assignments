<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 - Flexbox</title>

    <style>
        @media (max-width: 600px) {
    .navbar {
        flex-direction: column;
        gap: 15px;
        padding: 15px;
    }

    .nav-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .banner h1 {
        font-size: 28px;
    }
}
        /* Task 7.1: Navbar using Flexbox */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif; 
            background-color: #ffffff;
        }

        .navbar {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 15px 40px;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        /* Task 7.2: Banner using Flexbox */

.banner {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 400px;
    

    height: 400px;
    background-color: #dbeafe;
    text-align: center;
}

.banner h1 {
    font-size: 40px;
    color: #1e293b;
}

.banner p {
    font-size: 18px;
}

.banner button {
    padding: 12px 25px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 5px;
}
    /* Task 7.3: Flexbox Cards */

.cards-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 30px;
    width: 100%;
}

.card {
    flex: 1 1 200px;
    background-color: #f1f5f9;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
     min-height: 180px;
}

.card h2 {
    color: #2563eb;
}
    </style>
</head>

<body>

    <!-- Task 7.1: Navbar -->

    <nav class="navbar">

        <div class="logo">
            MyWebsite
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>

            <button>Get Started</button>
        </div>
        
    </nav>
    <!-- Task 7.2: Banner -->

<section class="banner">

    <h1>Welcome to My Website</h1>

    <p>Learn Web Development with Flexbox</p>

    <button>Explore More</button>

</section>
<!-- Task 7.3: Responsive Cards -->

<section class="cards-container">

    <div class="card">
        <h2>HTML</h2>
        <p>Learn the structure of web pages using HTML.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Design beautiful websites using CSS.</p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Make websites interactive using JavaScript.</p>
    </div>

</section>
</body>
</html>
