
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 9 - Responsive Landing Page</title>

    <style>
        /* Mobile First CSS */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e1f2f5;
            font-size: 1rem;
        }

        .navbar {

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background-color: #1e293b;
            color: white;
        }
        .navbar h2 {
    font-size: 1.5rem;
}

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 25px 15px;
            text-align: center;
        }

        .hero img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .hero h1 {
            font-size: 2rem;
        }

        .hero p {
            font-size: 1rem;
            line-height: 1.6;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 20px;
        }

        .feature-card {
            background-color: rgb(217, 145, 219);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            
        }
        .feature-card h2 {
      font-size: 1.25rem;
      }

     .feature-card p {
    font-size: 1rem;
      }

        /* Tablet: 768px and above */
        @media (min-width: 768px) {

            .navbar {
                flex-direction: row;
         justify-content: space-between;
            }
           .hero{
             grid-template-columns: 1fr 1fr;
           }

            .features {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Laptop: 1024px and above */
        @media (min-width: 1024px) {

            

            .features {
                grid-template-columns: repeat(3, 1fr);
                padding: 40px 100px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>MyWebsite</h2>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div>
            <h1>Welcome to My Website</h1>
            <p>
                Learn new skills, explore technology and build
                amazing projects with us.
            </p>
        </div>

        <img
            src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800"
            alt="Laptop on a desk"
        >
    </section>

    <section class="features">
        <div class="feature-card">
            <h2>HTML</h2>
            <p>Build the structure of web pages.</p>
        </div>

        <div class="feature-card">
            <h2>CSS</h2>
            <p>Design beautiful and responsive pages.</p>
        </div>

        <div class="feature-card">
            <h2>JavaScript</h2>
            <p>Add interactivity to websites.</p>
        </div>
    </section>

</body>
</html>
